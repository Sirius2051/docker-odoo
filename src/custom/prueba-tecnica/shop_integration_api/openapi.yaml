openapi: 3.0.3
info:
  title: API de la tienda en línea (Odoo 17, shop_integration_api)
  version: 3.0.0
  description: >
    Catálogo con existencias y creación de pedidos. Autenticación con clave API de un usuario
    de Odoo (Preferencias, Seguridad de la cuenta, Nueva clave API).
servers:
  - url: http://localhost:8069
security:
  - bearerAuth: []
paths:
  /api/v1/products:
    get:
      summary: Productos vendibles con existencias
      parameters:
        - {name: category_id, in: query, schema: {type: integer, minimum: 1}, description: Incluye subcategorías}
        - {name: in_stock, in: query, schema: {type: string, enum: ["1", "true", "yes"]}}
        - {name: modified_since, in: query, schema: {type: string, format: date-time}, description: ISO 8601; sin zona = UTC}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/Product"}}
                  meta: {$ref: "#/components/schemas/PageMeta"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /api/v1/orders:
    post:
      summary: Crea una cotización
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 255}
          description: >
            Misma clave y mismo cuerpo devuelven la misma respuesta sin crear otro pedido.
            Misma clave con otro cuerpo, 409 IDEMPOTENCY_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderRequest"}
      responses:
        "201":
          description: Cotización creada (o repetida por idempotencia)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: integer}
                      name: {type: string, example: S00042}
                      state: {type: string, example: draft}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Error:
      description: Error con el formato común
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Product:
      type: object
      properties:
        id: {type: integer}
        default_code: {type: string, nullable: true}
        name: {type: string}
        price: {type: number}
        qty_available: {type: number}
        category: {type: string, example: "Ropa / Camisas"}
    PageMeta:
      type: object
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        next_offset: {type: integer, nullable: true}
    OrderRequest:
      type: object
      required: [customer_vat, lines]
      properties:
        customer_vat: {type: string, example: J123456789}
        external_reference: {type: string, example: WEB-1001}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [default_code, quantity]
            properties:
              default_code: {type: string, example: API-001}
              quantity: {type: number, exclusiveMinimum: true, minimum: 0}
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_DATE, INVALID_PARAMETER, INVALID_JSON, INVALID_BODY, INVALID_LINE,
                     UNAUTHORIZED, REQUIRED_FIELD, CUSTOMER_NOT_FOUND, PRODUCT_NOT_FOUND,
                     INVALID_QUANTITY, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS, INTERNAL_ERROR]
            field: {type: string, example: "lines[1].default_code"}
            message: {type: string}